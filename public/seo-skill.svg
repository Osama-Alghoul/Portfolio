<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="React and Next.js SEO agent skill">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#05060a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.38" r="0.55">
      <stop offset="0" stop-color="#d4af37" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5d77a"/>
      <stop offset="1" stop-color="#b8892b"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1c2438" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#grid)" opacity="0.6"/>
  <rect width="1280" height="720" fill="url(#glow)"/>

  <!-- Agent terminal (left) -->
  <g transform="translate(90 150)">
    <rect width="470" height="420" rx="18" fill="#0d1322" stroke="#2a3550" stroke-width="2"/>
    <path d="M0 18a18 18 0 0 1 18-18h434a18 18 0 0 1 18 18v30H0z" fill="#151d31"/>
    <circle cx="28" cy="24" r="7" fill="#ff5f57"/>
    <circle cx="52" cy="24" r="7" fill="#febc2e"/>
    <circle cx="76" cy="24" r="7" fill="#28c840"/>
    <text x="235" y="30" fill="#6b7a99" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" text-anchor="middle">claude — react-nextjs-seo</text>

    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="19">
      <text x="28" y="96" fill="#d4af37">&gt; <tspan fill="#e6ebf5">add SEO to my app</tspan></text>
      <text x="28" y="146" fill="#60a5fa">● <tspan fill="#9fb0d0">1 Inspect</tspan></text>
      <text x="28" y="186" fill="#60a5fa">● <tspan fill="#9fb0d0">2 Gather facts</tspan></text>
      <text x="28" y="226" fill="#60a5fa">● <tspan fill="#9fb0d0">3 Implement</tspan></text>
      <text x="28" y="266" fill="#60a5fa">● <tspan fill="#9fb0d0">4 Verify</tspan></text>
      <text x="28" y="320" fill="#28c840">✓ <tspan fill="#e6ebf5">metadata · OG · JSON-LD</tspan></text>
      <text x="28" y="356" fill="#28c840">✓ <tspan fill="#e6ebf5">sitemap · robots · llms.txt</tspan></text>
      <text x="28" y="392" fill="#d4af37">audit.mjs <tspan fill="#28c840">0 errors</tspan></text>
    </g>
  </g>

  <!-- Search result card (right) -->
  <g transform="translate(640 190)">
    <rect width="550" height="250" rx="18" fill="#f8fafc"/>
    <rect x="28" y="28" width="494" height="44" rx="22" fill="#eef2f7" stroke="#d5dce6"/>
    <circle cx="56" cy="50" r="9" fill="none" stroke="#64748b" stroke-width="3"/>
    <path d="M63 57l8 8" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <text x="84" y="57" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="18">your-site.com</text>

    <circle cx="44" cy="112" r="14" fill="#0f172a"/>
    <path d="M38 118v-12l12 12v-12" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="68" y="108" fill="#1e293b" font-family="Arial, Helvetica, sans-serif" font-size="15">your-site.com</text>
    <text x="68" y="126" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="13">https://your-site.com › blog</text>
    <text x="28" y="166" fill="#1a0dab" font-family="Arial, Helvetica, sans-serif" font-size="23">Your Page Title, Ranked and Previewed</text>
    <text x="28" y="196" fill="#4d5156" font-family="Arial, Helvetica, sans-serif" font-size="16">Canonical, hreflang, structured data and social</text>
    <text x="28" y="218" fill="#4d5156" font-family="Arial, Helvetica, sans-serif" font-size="16">cards, set up correctly on every route.</text>
    <g fill="#f59e0b">
      <path d="M418 105l5 10 11 1.5-8 7.5 2 11-10-5.5-10 5.5 2-11-8-7.5 11-1.5z"/>
      <path d="M452 105l5 10 11 1.5-8 7.5 2 11-10-5.5-10 5.5 2-11-8-7.5 11-1.5z"/>
      <path d="M486 105l5 10 11 1.5-8 7.5 2 11-10-5.5-10 5.5 2-11-8-7.5 11-1.5z"/>
    </g>
  </g>

  <!-- Rank badge -->
  <g transform="translate(1130 160)">
    <circle r="52" fill="url(#gold)"/>
    <circle r="44" fill="none" stroke="#0b1020" stroke-opacity="0.35" stroke-width="2"/>
    <text y="-6" fill="#0b1020" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle">RANK</text>
    <text y="26" fill="#0b1020" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" text-anchor="middle">#1</text>
  </g>

  <!-- Framework chips -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="17" font-weight="600">
    <rect x="640" y="478" width="132" height="44" rx="22" fill="#0d1322" stroke="#2a3550" stroke-width="2"/>
    <text x="706" y="506" fill="#e6ebf5" text-anchor="middle">Next.js</text>
    <rect x="788" y="478" width="112" height="44" rx="22" fill="#0d1322" stroke="#2a3550" stroke-width="2"/>
    <text x="844" y="506" fill="#61dafb" text-anchor="middle">React</text>
    <rect x="916" y="478" width="176" height="44" rx="22" fill="#0d1322" stroke="#2a3550" stroke-width="2"/>
    <text x="1004" y="506" fill="#f87171" text-anchor="middle">React Router</text>
  </g>

  <!-- Title -->
  <text x="640" y="610" fill="url(#gold)" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="800">SKILL.md</text>
  <text x="826" y="610" fill="#9fb0d0" font-family="Arial, Helvetica, sans-serif" font-size="24">agent skill for SEO</text>
</svg>
